<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Control — Painel do Agente WhatsApp</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --border: #243047;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 1080px; margin: 0 auto; padding: 24px 16px; }
    .login-box {
      max-width: 380px; margin: 100px auto; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; padding: 28px;
    }
    h1, h2, h3 { margin: 0 0 8px 0; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .tab {
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
    }
    .tab.active { background: var(--accent); color: #0b0f19; border-color: var(--accent); font-weight: 600; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; margin-bottom: 16px;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    input, button {
      font-family: inherit; font-size: 0.9rem; border-radius: 8px; border: 1px solid var(--border);
    }
    input {
      background: #0b0f19; color: var(--text); padding: 9px 12px; width: 100%;
    }
    button {
      background: var(--accent); color: #0b0f19; border: none; padding: 9px 14px;
      font-weight: 600; cursor: pointer;
    }
    button.secondary { background: #1e293b; color: var(--text); border: 1px solid var(--border); }
    button.danger { background: rgba(239, 68, 68, 0.15); color: var(--err); border: 1px solid rgba(239,68,68,0.3); }
    button.warn { background: var(--warn); color: #0b0f19; }
    .env-row {
      display: grid; grid-template-columns: 240px 1fr auto auto; gap: 8px;
      align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    @media (max-width: 720px) {
      .env-row { grid-template-columns: 1fr; }
    }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
      background: rgba(34, 197, 94, 0.15); color: var(--ok);
    }
    pre {
      background: #0b0f19; border: 1px solid var(--border); border-radius: 8px;
      padding: 14px; overflow-x: auto; font-size: 0.82rem; max-height: 500px; white-space: pre-wrap;
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center; }
  </style>
</head>
<body>
  <div id="login-view" class="login-box">
    <h2>Agent Control</h2>
    <p class="muted">Painel de gerenciamento do agente WhatsApp</p>
    <input id="pwd" type="password" placeholder="Senha de acesso" style="margin: 14px 0;" />
    <button style="width: 100%;" onclick="login()">Entrar</button>
    <p id="login-err" style="color: var(--err); font-size: 0.85rem; margin-top: 10px;"></p>
  </div>

  <div id="app-view" class="container" style="display: none;">
    <header>
      <div>
        <h1>Agent Control <span id="status-badge" class="badge">carregando...</span></h1>
        <div class="muted" id="app-info">claude-code-whatsapp</div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="warn" onclick="restartApp()">Reiniciar Agente</button>
        <button class="secondary" onclick="logout()">Sair</button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="envs">Variáveis &amp; Chaves (.env)</button>
      <button class="tab" data-tab="logs">Logs</button>
      <button class="tab" data-tab="overview">Status</button>
    </div>

    <div id="panel-envs" class="panel active">
      <div class="card">
        <div class="toolbar">
          <input id="env-filter" placeholder="Filtrar por nome (ex: ALLOWED, KEY, MODEL, ENGINE)..." oninput="renderEnvs()" style="max-width: 380px;" />
          <button class="secondary" onclick="loadEnvs()">Atualizar</button>
        </div>
        <div id="env-list">Carregando...</div>
      </div>

      <div class="card">
        <h3>Adicionar nova variável</h3>
        <div class="toolbar" style="margin-top: 10px;">
          <input id="new-key" placeholder="NOME_DA_VARIAVEL" style="max-width: 260px;" />
          <input id="new-val" placeholder="Valor" style="flex: 1;" />
          <button onclick="addEnv()">Adicionar</button>
        </div>
      </div>
    </div>

    <div id="panel-logs" class="panel">
      <div class="card">
        <div class="toolbar">
          <button class="secondary" onclick="loadLogs()">Atualizar Logs</button>
        </div>
        <pre id="logs-output">Clique em "Atualizar Logs" para carregar...</pre>
      </div>
    </div>

    <div id="panel-overview" class="panel">
      <div class="card">
        <h3>Informações do Serviço</h3>
        <pre id="overview-json">{}</pre>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('agent_admin_token') || '';
    let allEnvs = [];

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'logs') loadLogs();
      });
    });

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          'x-admin-token': token,
          ...(opts.headers || {})
        }
      });
      if (res.status === 401) { logout(); throw new Error('Não autorizado'); }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erro na requisição');
      return data;
    }

    async function login() {
      const password = document.getElementById('pwd').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        if (!res.ok) throw new Error('Senha incorreta');
        token = password;
        localStorage.setItem('agent_admin_token', token);
        showApp();
      } catch (e) {
        document.getElementById('login-err').textContent = e.message;
      }
    }

    function logout() {
      localStorage.removeItem('agent_admin_token');
      token = '';
      document.getElementById('app-view').style.display = 'none';
      document.getElementById('login-view').style.display = 'block';
    }

    async function showApp() {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('app-view').style.display = 'block';
      await Promise.all([loadStatus(), loadEnvs()]);
    }

    async function loadStatus() {
      const s = await api('/api/status');
      document.getElementById('status-badge').textContent = s.status || 'desconhecido';
      document.getElementById('app-info').textContent = `${s.name} · ${s.git_repository || ''}`;
      document.getElementById('overview-json').textContent = JSON.stringify(s, null, 2);
    }

    async function loadEnvs() {
      allEnvs = await api('/api/envs');
      renderEnvs();
    }

    function renderEnvs() {
      const q = (document.getElementById('env-filter').value || '').toLowerCase();
      const filtered = allEnvs.filter(e => !q || (e.key || '').toLowerCase().includes(q));
      const container = document.getElementById('env-list');
      if (!filtered.length) {
        container.innerHTML = '<p class="muted">Nenhuma variável encontrada.</p>';
        return;
      }
      container.innerHTML = filtered.map(e => `
        <div class="env-row">
          <strong style="font-family: monospace; font-size: 0.85rem; word-break: break-all;">${e.key}</strong>
          <input id="val-${e.uuid}" value="${(e.value || '').replace(/"/g, '&quot;')}" />
          <button onclick="saveEnv('${e.key}', '${e.uuid}')">Salvar</button>
          <button class="danger" onclick="delEnv('${e.uuid}', '${e.key}')">Excluir</button>
        </div>
      `).join('');
    }

    async function saveEnv(key, uuid) {
      const value = document.getElementById('val-' + uuid).value;
      await api('/api/envs', { method: 'PATCH', body: JSON.stringify({ key, value }) });
      alert(`Variável ${key} salva! Clique em "Reiniciar Agente" quando terminar de editar.`);
    }

    async function addEnv() {
      const key = document.getElementById('new-key').value.trim();
      const value = document.getElementById('new-val').value;
      if (!key) return alert('Informe o nome da variável');
      await api('/api/envs', { method: 'POST', body: JSON.stringify({ key, value }) });
      document.getElementById('new-key').value = '';
      document.getElementById('new-val').value = '';
      await loadEnvs();
    }

    async function delEnv(uuid, key) {
      if (!confirm(`Remover a variável ${key}?`)) return;
      await api('/api/envs/' + uuid, { method: 'DELETE' });
      await loadEnvs();
    }

    async function loadLogs() {
      const data = await api('/api/logs');
      document.getElementById('logs-output').textContent = data.logs || JSON.stringify(data, null, 2);
    }

    async function restartApp() {
      if (!confirm('Reiniciar o agente WhatsApp para aplicar as novas variáveis?')) return;
      await api('/api/restart', { method: 'POST' });
      alert('Reinício solicitado! Aguarde alguns segundos.');
      loadStatus();
    }

    if (token) showApp().catch(() => {});
  </script>
</body>
</html>
